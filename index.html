<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Death Penalty — A Visual Novel</title>

    <link rel="stylesheet" href="node_modules/@monogatari/core/dist/engine/core/monogatari.css">
    <link rel="stylesheet" href="css/custom.css">
</head>
<body>
    <div id="monogatari">
        <div id="version-tag">v0.0.1</div>
        <visual-novel>
            <language-selection-screen></language-selection-screen>
            <loading-screen></loading-screen>
            <main-screen>
                <main-menu></main-menu>
            </main-screen>
            <game-screen>
                <dialog-log></dialog-log>
                <text-box></text-box>
                <quick-menu></quick-menu>
            </game-screen>
            <gallery-screen></gallery-screen>
            <credits-screen></credits-screen>
            <settings-screen></settings-screen>
            <save-screen></save-screen>
            <load-screen></load-screen>
        </visual-novel>
    </div>

    <script src="node_modules/@monogatari/core/dist/engine/core/monogatari.js"></script>
    <script src="js/script.js"></script>

    <!-- Hammer animation overlay -->
    <div id="hammer-overlay" hidden>
        <div id="hammer-sprite"></div>
    </div>

    <!-- Scene props — shown during gameplay -->
    <div id="prop-clipboard" hidden>
        <img src="assets/clipboard.png" alt="">
    </div>
    <div id="prop-case-doc" hidden>
        <img src="assets/case-doc.png" alt="">
    </div>
    <div id="prop-gavel" hidden>
        <img src="assets/gavel-block.png" alt="">
    </div>

    <!-- UI Buttons -->
    <button id="lang-btn" aria-label="Switch Language" title="Switch Language">EN</button>
    <button id="info-btn" aria-label="Legal information" title="Legal info">ІНФА</button>

    <!-- Epilogue overlay — real case story on wood background -->
    <div id="epilogue-overlay" hidden>
        <div id="epilogue-content">
            <div id="epilogue-intro"></div>
            <div id="epilogue-body"></div>
            <button id="epilogue-continue">Continue</button>
        </div>
    </div>

    <div id="info-panel" role="dialog" aria-modal="true" aria-label="Legal information" hidden>
        <div id="info-panel-inner">
            <button id="info-close" aria-label="Close">✕</button>
            <h2 id="info-title"></h2>
            <div id="info-body"></div>
        </div>
    </div>

    <script src="js/info.js"></script>
</body>
</html>
